
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
<form>

    <h2>Student Registration form</h2>
    <fieldset>
    <label for="Name"></label><b>Name</b>: <input type="text" name="" id="" placeholder="Enter first name">&nbsp;
    &nbsp;<label for="College"></label><b>College</b>: <input type="text"  id="" value="Nepathya College" disabled>
    <br></br>
    <label for="Email"></label><b>Email</b>: <input type="email" name="" id="" placeholder="Enter email">&nbsp;
    &nbsp;<label for="Password"></label><b>Password</b>: <input type="text" name="" id="" placeholder="Enter your password"> <br></br>
    <label for="Phone Number"></label><b>Phone Number</b>: <input type="tell" name="" id="" placeholder="Enter your phone number">
    &nbsp;<label for="DOB"></label><b>Date of Birth</b>: <input type="Date" > <br></br>
    </fieldset><br>

    <fieldset>
    <b>Favourite Programming Languages</b><br>

    <input type="checkbox" value="C">C <br>
    <input type="checkbox" value="C++">C++<br>
    <input type="checkbox" value="Javascript">Javascript<br></br>
    </fieldset>
    <br>

    <fieldset>

    <b>Select your gender</b>
       <label><br>
            <input type="radio" name="gender" value="male">Male <br>
            <input type="radio" name="gender" value="female"> Female<br>
            </label><br>

            </fieldset>
            <br>

            <fieldset>
       <label>Select course</label><br>

             <select name="Course">
                <option value="0" disabled selected>Select course</option>
                <option value="Bsc csit">BSC CSIT</option>
                <option value="Bca">BCA</option>
                <option value="Bit">BIT</option>
                <option value="Bba">BBA</option>
                </select> <br></br>
                </fieldset><br>
                
<fieldset>
            <b>Upload your document</b> <input type="File"><br></br>
            </fieldset><br>

            
            <label><b>Message/Feedback/Bio/Caption</b></label><br>
            <textarea rows="5" cols="30"></textarea><br></br>
            <br>

            <button>Register</button>
            </form>
</fieldset>




    
</body>
</html>
