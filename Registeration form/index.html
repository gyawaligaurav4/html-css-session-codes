<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="form">
        <form class="Form-card">
            <h1>Registration Form</h1>
            <p class="sub">Fill in your detail below.</p>
            <div class="Field">
                <label class="title"> Full Name <span class="text-danger">*</span></label>
                <input type="text" id="Full name" placeholder="Enter your full name" required>
            </div>

            <div class="Field">
                <label class="title"> Password <span class="text-danger">*</span></label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <div class="Field">
                <label class="title"> Address<span class="text-danger">*</span></label>
                <input type="text" id="Address" placeholder="Enter your address" required>
            </div>

            <div class="Field">
                <label class="title"> Select District <span class="text-danger">*</span></label>
                <select id="District" required>
                    <option value="0" disabled selected>Select District</option>
                    <option value="Rupandehi">Rupandehi</option>
                    <option value="Kathmandu">Kathmandu</option>
                    <option value="Pokhara">Pokhara</option>
                    <option value="Butwal">Butwal</option>
                </select>
            </div>

            <div class="Field">
                <label class="title"> Date Of Birth <span class="text-danger">*</span></label>
                <input type="Date" id="DOB" required>
            </div>

            <!-- Gender -->
            <fieldset>
                <span class="Legend">Gender <span class="text-danger">*</span>
                </span>
                <div class="options">
                    <label class="option">
                        <input type="radio" name="gender" value="male"> <span>Male</span>
                        <label class="option">
                            <input type="radio" name="gender" value="female"> <span>Female</span>
                        </label>
                </div>
            </fieldset>

            <!-- Hobbies -->

            <fieldset>
                <span class="Legend">Hobbies <span class="text-danger">*</span>
                </span>
                <div class="options">
                    <label class="option">
                        <input type="checkbox" name="Hobbies" value="Cricket"> <span>Cricket</span>
                    </label>
                    <label class="option">
                        <input type="checkbox" name="Hobbies" value="Football"> <span>Football</span>
                    </label>
                    <label class="option">
                        <input type="checkbox" name="Hobbies" value="Chess"> <span>Chess</span>
                    </label>
                </div>
            </fieldset>

            <!-- Message -->

            <div class="Field">
                <label class="title">Message</label>
                <textarea name="" id="Message" placeholder="Write your Message"></textarea>
            </div>

            <div class="buttons">
                <button type="reset">Reset</button>
                <button type="submit">Submit</button>
            </div>

        </form>
    </div>




</body>

</html>
